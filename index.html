<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Picture Puzzle</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    padding: 24px 12px 48px;
    background: #f2f1ec; color: #1c1c1c;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  h1 { font-size: 1.25rem; margin: 0; letter-spacing: .02em; }
  #controls {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
  }
  #controls label, #controls button, #controls select {
    font-size: .9rem;
  }
  #controls button, #controls .file-btn {
    padding: 8px 14px; border: none; border-radius: 8px; background: #1c1c1c; color: #fff;
    cursor: pointer;
  }
  #controls button:disabled { opacity: .4; cursor: default; }
  #controls select {
    padding: 6px 10px; border-radius: 8px; border: 1px solid #ccc;
  }
  #fileInput { display: none; }
  #status { font-size: .9rem; opacity: .75; min-width: 160px; text-align: center; }
  #dupWarning { display: none; font-size: .85rem; color: #8a5a00; background: #fdf0d5; border: 1px solid #e8c887; padding: 6px 12px; border-radius: 6px; }
  #dupWarning.show { display: block; }
  #cropStage { display: none; flex-direction: column; align-items: center; gap: 10px; }
  #cropStage.show { display: flex; }
  #cropStage p { margin: 0; font-size: .85rem; opacity: .7; }
  #cropBox {
    width: 320px; height: 320px; overflow: hidden; position: relative;
    border: 3px solid #1c1c1c; border-radius: 4px; touch-action: none; cursor: grab;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
  }
  #cropBox.grabbing { cursor: grabbing; }
  #cropImg { position: absolute; left: 0; top: 0; user-select: none; -webkit-user-drag: none; }
  #zoomSlider { width: 320px; }
  #usePhotoBtn { padding: 8px 14px; border: none; border-radius: 8px; background: #1c1c1c; color: #fff; cursor: pointer; }
  #boardWrap { position: relative; }
  #board {
    position: relative; overflow: hidden;
    background: #d8d6cd;
    border: 3px solid #1c1c1c; border-radius: 4px;
    box-shadow: 0 10px 30px rgba(0,0,0,.15);
    touch-action: none;
  }
  .slot { position: absolute; }
  .slot.empty { background: rgba(0,0,0,.05); outline: 1px dashed rgba(0,0,0,.15); outline-offset: -1px; }
  .slot.over { background: rgba(74,144,226,.18); }
  .piece {
    cursor: grab;
    background-repeat: no-repeat;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.4));
  }
  .piece:active { cursor: grabbing; }
  #win {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 6px;
    background: rgba(255,255,255,.92); border-radius: 4px; text-align: center;
  }
  #win.show { display: flex; }
  #win strong { font-size: 1.3rem; }
  #tray {
    width: 100%; max-width: 640px; min-height: 70px;
    display: flex; flex-wrap: wrap; gap: 2px; align-content: flex-start; justify-content: center;
    padding: 8px; background: #e4e3dc; border-radius: 8px;
    border: 2px dashed #bbb;
  }
  #tray.over { border-color: #4a90e2; }
  #empty-hint {
    opacity: .6; font-size: .9rem; margin: auto; padding: 20px;
  }
</style>
</head>
<body>
  <h1>Picture Puzzle</h1>
  <div id="controls">
    <button class="file-btn" id="pickBtn">Upload Photo</button>
    <input type="file" id="fileInput" accept="image/*">
    <select id="gridSize">
      <option value="3">3 × 3</option>
      <option value="4" selected>4 × 4</option>
      <option value="5">5 × 5</option>
      <option value="6">6 × 6</option>
    </select>
    <button id="shuffleBtn" disabled>Shuffle</button>
    <span id="status"></span>
  </div>
  <div id="dupWarning">This photo has repeating or plain areas — some pieces may look alike.</div>

  <div id="cropStage">
    <p>Drag to reposition, zoom to frame the part you want — avoid large plain or repeating areas.</p>
    <div id="cropBox"><img id="cropImg" draggable="false"></div>
    <input type="range" id="zoomSlider" min="1" max="3" step="0.01" value="1">
    <button id="usePhotoBtn">Use This Crop</button>
  </div>

  <div id="boardWrap">
    <div id="board"></div>
    <div id="win"><strong>Solved! 🎉</strong><span id="winStats"></span></div>
  </div>

  <div id="tray">
    <div id="empty-hint">Upload a photo to start the puzzle</div>
  </div>

<script>
const fileInput = document.getElementById('fileInput');
const pickBtn = document.getElementById('pickBtn');
const gridSizeSel = document.getElementById('gridSize');
const shuffleBtn = document.getElementById('shuffleBtn');
const statusEl = document.getElementById('status');
const boardEl = document.getElementById('board');
const trayEl = document.getElementById('tray');
const winEl = document.getElementById('win');
const winStats = document.getElementById('winStats');
const dupWarningEl = document.getElementById('dupWarning');
const cropStageEl = document.getElementById('cropStage');
const cropBoxEl = document.getElementById('cropBox');
const cropImgEl = document.getElementById('cropImg');
const zoomSliderEl = document.getElementById('zoomSlider');
const usePhotoBtn = document.getElementById('usePhotoBtn');

let BOARD_PX = 480;
let N = 4, cell = BOARD_PX / N, TAB = cell * 0.4;
let imgData = null;      // square-cropped data URL
let srcCanvas = null;    // same square crop, kept as a canvas for pixel sampling
let board = [];          // board[slotIndex] = pieceId | null
let tray = [];           // array of pieceId, in tray order
let hSign = [], vSign = []; // shared tab/blank orientation per internal edge
let piecePaths = [];     // clip-path 'd' string per piece id, local to its own box
let moves = 0, startTime = 0, timerId = null;
let drag = null;         // { id, from: 'tray' | slotIndex }

// --- crop / pan / zoom stage -----------------------------------------------
// Photos often have a large plain or repeating background (a plate, a wall)
// around the actual subject. Auto-cropping the center can't avoid that, so
// let the user pick which square of the photo becomes the puzzle.
const CROP_BOX = 320;
let rawImg = null, cropZoom = 1, cropPanX = 0, cropPanY = 0, cropBaseScale = 1;

pickBtn.onclick = () => fileInput.click();
fileInput.onchange = () => {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      rawImg = img;
      cropImgEl.src = img.src;
      cropBaseScale = CROP_BOX / Math.min(img.width, img.height);
      const best = findDetailedRegion(img);
      cropZoom = best.zoom;
      cropPanX = -best.x * cropBaseScale * cropZoom;
      cropPanY = -best.y * cropBaseScale * cropZoom;
      zoomSliderEl.value = cropZoom;
      updateCropTransform();
      cropStageEl.classList.add('show');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
};

// Default the crop to the most detailed square region of the photo (highest
// local contrast), rather than dead-center, so a plain/repeating background
// isn't what the user has to notice and manually crop away themselves.
function findDetailedRegion(img) {
  const ANALYSIS = 96;
  const landscape = img.width >= img.height;
  const aw = landscape ? ANALYSIS : Math.round(ANALYSIS * img.width / img.height);
  const ah = landscape ? Math.round(ANALYSIS * img.height / img.width) : ANALYSIS;
  const ac = document.createElement('canvas');
  ac.width = aw; ac.height = ah;
  const actx = ac.getContext('2d', { willReadFrequently: true });
  actx.drawImage(img, 0, 0, aw, ah);
  const data = actx.getImageData(0, 0, aw, ah).data;
  const gray = new Float64Array(aw * ah);
  for (let i = 0; i < aw * ah; i++) {
    const o = i * 4;
    gray[i] = 0.299 * data[o] + 0.587 * data[o + 1] + 0.114 * data[o + 2];
  }
  const energy = new Float64Array(aw * ah);
  for (let y = 0; y < ah; y++) {
    for (let x = 0; x < aw; x++) {
      const i = y * aw + x;
      const gx = x + 1 < aw ? Math.abs(gray[i + 1] - gray[i]) : 0;
      const gy = y + 1 < ah ? Math.abs(gray[i + aw] - gray[i]) : 0;
      energy[i] = gx + gy;
    }
  }
  const integ = new Float64Array((aw + 1) * (ah + 1));
  for (let y = 0; y < ah; y++) {
    let rowSum = 0;
    for (let x = 0; x < aw; x++) {
      rowSum += energy[y * aw + x];
      integ[(y + 1) * (aw + 1) + (x + 1)] = integ[y * (aw + 1) + (x + 1)] + rowSum;
    }
  }
  const windowSum = (x0, y0, w, h) => {
    const x1 = x0 + w, y1 = y0 + h;
    return integ[y1 * (aw + 1) + x1] - integ[y0 * (aw + 1) + x1] - integ[y1 * (aw + 1) + x0] + integ[y0 * (aw + 1) + x0];
  };
  // Search across zoom levels too (not just position) so a square or
  // centrally-plain photo can still zoom into whatever detail exists,
  // rather than only sliding a fixed full-frame window.
  const minSide = Math.min(aw, ah);
  let best = { density: -1, x: 0, y: 0, zoom: 1 };
  for (const zoom of [1, 1.3, 1.6, 2, 2.5, 3]) {
    const win = Math.round(minSide / zoom);
    if (win < 4) continue;
    const stride = Math.max(1, Math.round(win / 8));
    for (let y = 0; y + win <= ah; y += stride) {
      for (let x = 0; x + win <= aw; x += stride) {
        const density = windowSum(x, y, win, win) / (win * win);
        if (density > best.density) best = { density, x, y, zoom };
      }
    }
  }
  const scale = aw / img.width;
  return { x: best.x / scale, y: best.y / scale, zoom: best.zoom };
}

function updateCropTransform() {
  const w = rawImg.width * cropBaseScale * cropZoom, h = rawImg.height * cropBaseScale * cropZoom;
  cropPanX = Math.min(0, Math.max(CROP_BOX - w, cropPanX));
  cropPanY = Math.min(0, Math.max(CROP_BOX - h, cropPanY));
  cropImgEl.style.width = w + 'px';
  cropImgEl.style.height = h + 'px';
  cropImgEl.style.left = cropPanX + 'px';
  cropImgEl.style.top = cropPanY + 'px';
}

zoomSliderEl.oninput = () => {
  cropZoom = parseFloat(zoomSliderEl.value);
  updateCropTransform();
};

let dragStart = null; // { x, y, panX, panY }
cropBoxEl.addEventListener('pointerdown', e => {
  dragStart = { x: e.clientX, y: e.clientY, panX: cropPanX, panY: cropPanY };
  cropBoxEl.setPointerCapture(e.pointerId);
  cropBoxEl.classList.add('grabbing');
});
cropBoxEl.addEventListener('pointermove', e => {
  if (!dragStart) return;
  cropPanX = dragStart.panX + (e.clientX - dragStart.x);
  cropPanY = dragStart.panY + (e.clientY - dragStart.y);
  updateCropTransform();
});
cropBoxEl.addEventListener('pointerup', () => { dragStart = null; cropBoxEl.classList.remove('grabbing'); });
cropBoxEl.addEventListener('pointercancel', () => { dragStart = null; cropBoxEl.classList.remove('grabbing'); });

usePhotoBtn.onclick = () => {
  const scale = cropBaseScale * cropZoom;
  const sx = -cropPanX / scale, sy = -cropPanY / scale, sSize = CROP_BOX / scale;
  const c = document.createElement('canvas');
  c.width = c.height = BOARD_PX;
  c.getContext('2d').drawImage(rawImg, sx, sy, sSize, sSize, 0, 0, BOARD_PX, BOARD_PX);
  imgData = c.toDataURL();
  srcCanvas = c;
  cropStageEl.classList.remove('show');
  startPuzzle();
};

gridSizeSel.onchange = () => { if (imgData) startPuzzle(); };
shuffleBtn.onclick = () => { if (imgData) startPuzzle(); };

function startPuzzle() {
  N = parseInt(gridSizeSel.value, 10);
  const avail = Math.min(520, window.innerWidth - 40);
  const unit = 60; // divides evenly by 3,4,5,6 -> no subpixel gaps
  BOARD_PX = Math.max(5, Math.floor(avail / unit)) * unit;
  cell = BOARD_PX / N;
  TAB = cell * 0.4;
  const total = N * N;
  board = new Array(total).fill(null);
  tray = shuffle([...Array(total).keys()]);
  buildPieceShapes();
  flagLookalikePieces();
  moves = 0;
  startTime = Date.now();
  clearInterval(timerId);
  timerId = setInterval(updateStatus, 1000);
  shuffleBtn.disabled = false;
  winEl.classList.remove('show');
  boardEl.style.width = boardEl.style.height = BOARD_PX + 'px';
  render();
  updateStatus();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// --- jigsaw edge geometry ---------------------------------------------

// One tab/blank silhouette along a baseline (0,0)-(L,0); the knob bulges
// toward +v, flipped by `sign`. Returns points in local (u along, v perp) units.
function knobPoints(L, sign) {
  const R = L * 0.18, headV = R * 1.1, baseHalf = L * 0.15, gapHalf = 40, steps = 16;
  const cu = L / 2;
  const pts = [{ u: 0, v: 0 }, { u: cu - baseHalf, v: 0 }];
  const a0 = 270 - gapHalf, a1 = 270 + gapHalf - 360;
  for (let i = 0; i <= steps; i++) {
    const ang = (a0 + (a1 - a0) * i / steps) * Math.PI / 180;
    pts.push({ u: cu + R * Math.cos(ang), v: headV + R * Math.sin(ang) });
  }
  pts.push({ u: cu + baseHalf, v: 0 }, { u: L, v: 0 });
  return pts.map(p => ({ u: p.u, v: p.v * sign }));
}

function edgePoints(x0, y0, x1, y1, sign, len) {
  const dx = x1 - x0, dy = y1 - y0;
  const ux = dx / len, uy = dy / len, px = dy / len, py = dx / len;
  return knobPoints(len, sign).map(p => ({
    x: x0 + p.u * ux + p.v * px,
    y: y0 + p.u * uy + p.v * py,
  }));
}

// Smooth a point sequence into SVG cubic-bezier commands (Catmull-Rom), assuming
// the pen is already positioned at pts[0].
function smoothPath(pts) {
  const p = [pts[0], ...pts, pts[pts.length - 1]];
  let d = '';
  for (let i = 1; i < p.length - 2; i++) {
    const p0 = p[i - 1], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2];
    const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    d += `C ${c1x.toFixed(2)},${c1y.toFixed(2)} ${c2x.toFixed(2)},${c2y.toFixed(2)} ${p2.x.toFixed(2)},${p2.y.toFixed(2)} `;
  }
  return d;
}

// Build the clip-path 'd' string for one piece, in local coordinates of its own
// (cell + 2*TAB) box. Each side is either a straight board-edge line (sign===null)
// or a knob curve; sign is shared with the neighboring piece so shapes interlock.
function piecePath(topS, rightS, bottomS, leftS) {
  const x0 = TAB, y0 = TAB, x1 = TAB + cell, y1 = TAB + cell;
  let d = `M ${x0},${y0} `;
  d += topS === null ? `L ${x1},${y0} ` : smoothPath(edgePoints(x0, y0, x1, y0, topS, cell));
  d += rightS === null ? `L ${x1},${y1} ` : smoothPath(edgePoints(x1, y0, x1, y1, rightS, cell));
  d += bottomS === null ? `L ${x0},${y1} ` : smoothPath(edgePoints(x0, y1, x1, y1, bottomS, cell).reverse());
  d += leftS === null ? `L ${x0},${y0} ` : smoothPath(edgePoints(x0, y0, x0, y1, leftS, cell).reverse());
  d += 'Z';
  return d;
}

function buildPieceShapes() {
  hSign = Array.from({ length: N - 1 }, () => Array.from({ length: N }, () => (Math.random() < 0.5 ? 1 : -1)));
  vSign = Array.from({ length: N }, () => Array.from({ length: N - 1 }, () => (Math.random() < 0.5 ? 1 : -1)));
  piecePaths = new Array(N * N);
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const topS = r === 0 ? null : hSign[r - 1][c];
      const rightS = c === N - 1 ? null : vSign[r][c];
      const bottomS = r === N - 1 ? null : hSign[r][c];
      const leftS = c === 0 ? null : vSign[r][c - 1];
      piecePaths[r * N + c] = piecePath(topS, rightS, bottomS, leftS);
    }
  }
}

// --- lookalike-piece detection --------------------------------------------
// A photo with a large flat/uniform area (sky, plain wall) can slice into
// pieces that are pixel-different but visually indistinguishable. This flags
// that case by comparing average piece color; it can't reliably catch a
// repeating *textured* pattern (bricks, fabric) since that needs real
// texture analysis, not just color comparison. We can't fix the photo
// either way, so just tell the user rather than leave them confused.
const sigCanvas = document.createElement('canvas');
sigCanvas.width = sigCanvas.height = 4;
const sigCtx = sigCanvas.getContext('2d', { willReadFrequently: true });

function pieceSignature(row, col) {
  const sw = srcCanvas.width / N, sh = srcCanvas.height / N;
  sigCtx.drawImage(srcCanvas, col * sw, row * sh, sw, sh, 0, 0, 4, 4);
  return sigCtx.getImageData(0, 0, 4, 4).data;
}

function flagLookalikePieces() {
  const total = N * N;
  const sigs = new Array(total);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) sigs[r * N + c] = pieceSignature(r, c);
  const SIMILAR = 16; // avg per-channel difference below this reads as "looks the same"
  let found = false;
  for (let i = 0; i < total && !found; i++) {
    for (let j = i + 1; j < total && !found; j++) {
      let diff = 0;
      for (let k = 0; k < sigs[i].length; k++) diff += Math.abs(sigs[i][k] - sigs[j][k]);
      if (diff / sigs[i].length < SIMILAR) found = true;
    }
  }
  dupWarningEl.classList.toggle('show', found);
}

// --- rendering -----------------------------------------------------------

function makePieceEl(id) {
  const div = document.createElement('div');
  div.className = 'piece';
  div.draggable = true;
  const box = cell + 2 * TAB;
  div.style.width = div.style.height = box + 'px';
  const row = Math.floor(id / N), col = id % N;
  div.style.backgroundImage = `url(${imgData})`;
  div.style.backgroundSize = `${BOARD_PX}px ${BOARD_PX}px`;
  div.style.backgroundPosition = `${TAB - col * cell}px ${TAB - row * cell}px`;
  div.style.clipPath = `path('${piecePaths[id]}')`;
  div.dataset.id = id;
  div.addEventListener('dragstart', e => {
    const from = div.closest('.slot') ? +div.closest('.slot').dataset.index : 'tray';
    drag = { id, from };
    e.dataTransfer.effectAllowed = 'move';
  });
  return div;
}

function render() {
  boardEl.innerHTML = '';
  for (let i = 0; i < N * N; i++) {
    const r = Math.floor(i / N), c = i % N;
    const slot = document.createElement('div');
    slot.className = 'slot' + (board[i] === null ? ' empty' : '');
    slot.dataset.index = i;
    slot.style.left = c * cell + 'px';
    slot.style.top = r * cell + 'px';
    slot.style.width = slot.style.height = cell + 'px';
    if (board[i] !== null) {
      const piece = makePieceEl(board[i]);
      piece.style.position = 'absolute';
      piece.style.left = piece.style.top = -TAB + 'px';
      slot.appendChild(piece);
    }
    slot.addEventListener('dragover', e => { e.preventDefault(); slot.classList.add('over'); });
    slot.addEventListener('dragleave', () => slot.classList.remove('over'));
    slot.addEventListener('drop', e => {
      e.preventDefault();
      slot.classList.remove('over');
      dropOnBoard(i);
    });
    boardEl.appendChild(slot);
  }

  trayEl.innerHTML = '';
  if (tray.length === 0 && !imgData) {
    trayEl.appendChild(Object.assign(document.createElement('div'), { id: 'empty-hint', textContent: 'Upload a photo to start the puzzle' }));
  } else {
    tray.forEach(id => trayEl.appendChild(makePieceEl(id)));
  }
}

trayEl.addEventListener('dragover', e => { e.preventDefault(); trayEl.classList.add('over'); });
trayEl.addEventListener('dragleave', () => trayEl.classList.remove('over'));
trayEl.addEventListener('drop', e => {
  e.preventDefault();
  trayEl.classList.remove('over');
  dropOnTray();
});

function dropOnBoard(i) {
  if (!drag) return;
  if (drag.from === i) { drag = null; return; }
  const occupant = board[i];
  board[i] = drag.id;
  if (drag.from === 'tray') {
    tray = tray.filter(id => id !== drag.id);
    if (occupant !== null) tray.push(occupant);
  } else {
    board[drag.from] = occupant;
  }
  moves++;
  drag = null;
  render();
  updateStatus();
  checkWin();
}

function dropOnTray() {
  if (!drag) return;
  if (drag.from === 'tray') { drag = null; return; }
  board[drag.from] = null;
  tray.push(drag.id);
  moves++;
  drag = null;
  render();
  updateStatus();
}

function checkWin() {
  if (board.every((id, i) => id === i)) {
    clearInterval(timerId);
    const secs = Math.round((Date.now() - startTime) / 1000);
    winStats.textContent = `${moves} moves · ${secs}s`;
    winEl.classList.add('show');
  }
}

function updateStatus() {
  const secs = Math.round((Date.now() - startTime) / 1000);
  statusEl.textContent = `Moves: ${moves} · Time: ${secs}s`;
}
</script>
</body>
</html>
